services:
  - type: web
    name: vocabquest
    runtime: node
    plan: free
    buildCommand: bun install && bun run db:generate && bun run db:push --accept-data-loss && bun prisma/seed.ts && bun run build
    startCommand: bun .next/standalone/server.js
    envVars:
      - key: DATABASE_URL
        value: file:./db/custom.db
      - key: NEXTAUTH_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
    healthCheckPath: /
    autoDeploy: true
